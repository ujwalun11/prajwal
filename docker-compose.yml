services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TRANA_DATA_DIR: /app/backend/data
      TRANA_DATABASE_URL: sqlite:////app/backend/data/trana.sqlite3
      SCENARIO_MINUTE_SECONDS: "60"
    volumes:
      - ./backend/data:/app/backend/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  field:
    build:
      context: ./web/field
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    build:
      context: ./web/dashboard
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5174:5174"
    depends_on:
      api:
        condition: service_healthy
