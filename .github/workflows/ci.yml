name: TRANA checks

on:
  push:
    branches: ["main", "a/**", "b/**", "c/**"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    name: Tests for folders present in this branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backend compile and tests (when present)
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            python -m compileall -q backend scenario scripts
            if [ -d backend/tests ]; then pytest -q backend/tests; fi
          else
            echo "No backend on this branch; skipping."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Field app tests and build (when present)
        shell: bash
        run: |
          if [ -f web/field/package.json ]; then
            cd web/field
            npm install
            npm test
            npm run build
          else
            echo "Field app not present on this branch; skipping."
          fi
      - name: Dashboard tests and build (when present)
        shell: bash
        run: |
          if [ -f web/dashboard/package.json ]; then
            cd web/dashboard
            npm install
            npm test
            npm run build
          else
            echo "Dashboard not present on this branch; skipping."
          fi
