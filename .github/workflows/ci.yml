name: TRANA checks
on:
  push:
    branches: ["main", "a/**", "b/**", "c/**"]
  pull_request:
    branches: ["main"]
jobs:
  backend:
    if: ${{ hashFiles('requirements.txt') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q backend scenario scripts
      - run: pytest -q backend/tests
  field:
    if: ${{ hashFiles('web/field/package.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: web/field
        run: npm install
      - working-directory: web/field
        run: npm test
      - working-directory: web/field
        run: npm run build
  dashboard:
    if: ${{ hashFiles('web/dashboard/package.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: web/dashboard
        run: npm install
      - working-directory: web/dashboard
        run: npm test
      - working-directory: web/dashboard
        run: npm run build
